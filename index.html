<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07091a">
<meta name="description" content="JK AdiStore — MLBB, VPN, Aplikasi, Digital Store & AI">
<title>JK AdiStore</title>

<style>
:root{
 --container:1180px;
 --sp-1:4px;
 --sp-2:8px;
 --sp-3:12px;
 --sp-4:16px;
 --sp-5:20px;
 --sp-6:24px;
 --sp-7:32px;
 --sp-8:40px;
 --radius-sm:10px;
 --radius-md:14px;
 --radius-lg:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}

html{
 overflow-x:hidden;
 width:100%;
}

body{
 margin:0;
 width:100%;
 overflow-x:hidden;
 font-family:system-ui,-apple-system,Segoe UI,sans-serif;
 background:#050716;
 color:#fff;
 min-height:100vh;
 background-image:
 radial-gradient(circle at 10% 10%,#2563eb22,transparent 30%),
 radial-gradient(circle at 90% 20%,#00e5ff1d,transparent 30%),
 radial-gradient(circle at 50% 90%,#8b5cf622,transparent 35%);
}

body:before{
 content:"";
 position:fixed;
 inset:-50%;
 z-index:-1;
 background:conic-gradient(
  #2563eb14,#38bdf810,#00e5ff14,
  #5b5cff12,#2563eb14
 );
 filter:blur(55px);
 animation:none;
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

@keyframes rainbow{
 0%,100%{background-position:0% 50%}
 50%{background-position:100% 50%}
}

@keyframes tickerMove{
 from{transform:translateX(0)}
 to{transform:translateX(-33.3333%)}
}

@keyframes rainbowBlink{
 0%,100%{opacity:1;filter:brightness(1)}
 50%{opacity:.9;filter:brightness(1.12)}
}

.top-ticker{
 width:100%;
 overflow:hidden;
 margin-bottom:18px;
 border:1px solid #ffffff18;
 border-radius:14px;
 background:#00000022;
 box-shadow:0 0 24px #2563eb22;
}

.top-ticker-track{
 display:flex;
 width:max-content;
 min-width:max-content;
 padding:9px 0;
 font-size:clamp(14px,2.8vw,20px);
 font-weight:750;
 letter-spacing:1px;
 animation:tickerMove 32s linear infinite;
 will-change:transform;
}

.top-ticker-text{
 display:block;
 flex:0 0 auto;
 padding:0 28px;
 background:linear-gradient(90deg,#2563eb,#1d4ed8,#38bdf8,#60a5fa,#00e5ff,#5b5cff,#2563eb);
 background-size:500% 100%;
 -webkit-background-clip:text;
 background-clip:text;
 color:transparent;
 animation:rainbow 5s linear infinite;
}

/* ============ BANNER / SLIDER (JK AdiStore) ============ */
.jk-slider{
 position:relative;
 width:100%;
 overflow:hidden;
 background:linear-gradient(135deg,#0a0e22,#141a35);
 touch-action:pan-y;
 user-select:none;
 contain:content;
}
.jk-slider-track{
 display:flex;
 width:100%;
 height:100%;
 will-change:transform;
 transition:transform .5s cubic-bezier(.4,0,.2,1);
}
.jk-slider-track.jk-dragging{transition:none}
.jk-slide{
 flex:0 0 100%;
 min-width:100%;
 position:relative;
 aspect-ratio:16/6;
 max-height:420px;
 overflow:hidden;
 display:block;
 cursor:pointer;
 text-decoration:none;
 background:radial-gradient(circle at 30% 30%,#2563eb33,transparent 60%),radial-gradient(circle at 80% 70%,#00e5ff2a,transparent 55%);
}
@media(max-width:700px){.jk-slide{aspect-ratio:16/10;max-height:260px}}
.jk-slide img{
 width:100%;height:100%;object-fit:cover;display:block;
 pointer-events:none;
}
.jk-slide:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(180deg,#00000000 40%,#050716e6 100%);
 pointer-events:none;
}
.jk-slide-caption{
 position:absolute;left:0;right:0;bottom:0;
 padding:14px clamp(14px,4vw,40px) 24px;
 z-index:2;
}
.jk-slide-caption b{
 font-size:clamp(16px,3.2vw,26px);
 display:block;
 text-shadow:0 2px 14px #000a;
}
.jk-slider-dots{
 position:absolute;left:0;right:0;bottom:9px;
 display:flex;justify-content:center;gap:7px;z-index:3;
}
.jk-slider-dot{
 width:8px;height:8px;border-radius:99px;
 background:#ffffff55;border:0;padding:0;cursor:pointer;
 transition:.25s;
}
.jk-slider-dot.active{background:#00e5ff;width:22px;box-shadow:0 0 10px #00e5ffaa}
.jk-slider-arrow{
 position:absolute;top:50%;transform:translateY(-50%);
 width:38px;height:38px;border-radius:50%;
 background:#00000055;border:1px solid #ffffff30;
 color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;
 cursor:pointer;z-index:3;backdrop-filter:blur(4px);
}
.jk-slider-arrow.prev{left:10px}
.jk-slider-arrow.next{right:10px}
@media(max-width:700px){.jk-slider-arrow{display:none}}

/* ============ ADMIN: MEDIA & ULASAN LISTS ============ */
.jk-media-row{
 display:flex;gap:12px;align-items:center;
 padding:10px;border:1px solid #ffffff16;border-radius:12px;
 background:#0007;margin-bottom:9px;flex-wrap:wrap;
}
.jk-media-row img,.jk-media-row .jk-media-thumb{
 width:64px;height:64px;object-fit:cover;border-radius:9px;flex:0 0 auto;
 background:#141a35;
}
.jk-media-row .jk-media-info{flex:1 1 180px;min-width:0}
.jk-media-row .jk-media-info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jk-media-actions{display:flex;gap:6px;flex-wrap:wrap}
.jk-media-actions button{padding:7px 10px;min-height:auto;font-size:12.5px}
.jk-testi-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#2563eb,#5b5cff)}

.hero-title-row{
 display:flex; align-items:center; justify-content:flex-start; gap:clamp(24px,5vw,64px);
 flex-wrap:nowrap; margin:4px 0 10px; width:100%;
}
.hero-title-row h1{margin:0!important; flex:0 1 auto;}
.store-clock{
 flex:0 0 auto; display:flex; align-items:center; justify-content:center;
 min-height:64px; padding:8px 16px; border:1px solid #ffffff30; border-radius:18px;
 background:linear-gradient(135deg,#2563eb1a,#5b5cff18,#00e5ff18);
 box-shadow:0 0 30px #2563eb2c,inset 0 0 22px #ffffff08; overflow:hidden;
}
.store-clock .clock-time{display:inline-block; font-size:clamp(30px,6vw,54px); line-height:1; font-weight:800; letter-spacing:2px;
 background:linear-gradient(90deg,#2563eb,#1d4ed8,#38bdf8,#60a5fa,#00e5ff,#5b5cff,#2563eb);
 background-size:600% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
 animation:rainbow 4s linear infinite,rainbowBlink 2.6s ease-in-out infinite; text-shadow:0 0 18px #2563eb55}
@media(max-width:700px){
 .top .brand img{width:38px!important;height:38px!important}
 .hero-card img{width:60px!important;height:60px!important}
 .hero-title-row{gap:16px; align-items:center}
 .hero-title-row h1{font-size:clamp(38px,10vw,58px)!important}
 .store-clock{min-height:54px;padding:7px 11px;border-radius:15px}
 .store-clock .clock-time{font-size:clamp(22px,6.5vw,36px);letter-spacing:1px}
}
.top .brand img{width:42px!important;height:42px!important;object-fit:cover;border-radius:12px}
.hero-card img{width:74px!important;height:74px!important;object-fit:cover;border-radius:16px}
@media(max-width:700px){.top .brand img{width:38px!important;height:38px!important}.hero-card img{width:60px!important;height:60px!important}.store-clock{min-height:64px;padding:8px 12px}}

.rainbow{
 background:linear-gradient(
  90deg,#2563eb,#5b5cff,#00e5ff,
  #38bdf8,#1d4ed8,#2563eb
 );
 background-size:400% 400%;
 animation:rainbow 9s ease infinite;
 -webkit-background-clip:text;
 background-clip:text;
 color:transparent;
}

.wrap{
 width:min(var(--container),94%);
 margin:auto;
 max-width:100%;
}

.top{
 position:sticky;
 top:0;
 z-index:30;
 background:#050716dd;
 backdrop-filter:blur(16px);
 border-bottom:1px solid #ffffff1c;
}

.nav{
 min-height:68px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:var(--sp-4);
}

.brand{
 display:flex;
 gap:10px;
 align-items:center;
 font-weight:900;
 border:0;
 background:none;
 color:#fff;
 cursor:pointer;
}

.brand img{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 border:2px solid #00e5ff;
}

.navlinks{
 display:flex;
 gap:var(--sp-2);
 align-items:center;
}

button,.btn{
 border:1px solid #ffffff1b;
 background:#ffffff0c;
 color:#fff;
 border-radius:var(--radius-sm);
 padding:10px var(--sp-4);
 min-height:44px;
 font-weight:800;
 cursor:pointer;
 line-height:1.2;
}

button:hover,.btn:hover{
 background:#ffffff16;
}

.primary{
 border:0;
 background:linear-gradient(100deg,#2563eb,#5b5cff,#00e5ff);
}

.hero{
 padding:14px 0 60px;
}

.hero-grid{
 display:grid;
 grid-template-columns:1.25fr .75fr;
 gap:var(--sp-6);
 align-items:center;
}

.hero h1{
 font-size:clamp(45px,8vw,80px);
 line-height:.9;
 margin:15px 0;
}

.hero-card,.card,.panel{
 background:#0c1227dd;
 border:1px solid #ffffff16;
 border-radius:20px;
 box-shadow:0 20px 70px #0005;
}

.hero-card{
 padding:18px;
}

.hero-card img{
 width:100%;
 aspect-ratio:1.3;
 object-fit:cover;
 border-radius:15px;
}

.muted{
 color:#aeb7d4;
}

.marquee{
 overflow:hidden;
 border-block:1px solid #ffffff15;
 white-space:nowrap;
}

.track{
 display:inline-block;
 padding:12px;
 font-weight:900;
 animation:marquee 25s linear infinite;
}

.track span{
 margin:0 35px;
}

@keyframes marquee{
 to{transform:translateX(-50%)}
}

section{
 padding:var(--sp-7) 0;
}

#shop{
 scroll-margin-top:82px;
}

.head{
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:var(--sp-3);
 margin-bottom:var(--sp-4);
 flex-wrap:wrap;
}

.head h2{
 margin:0;
}

.input,.select,.area{
 width:100%;
 padding:10px var(--sp-4);
 min-height:44px;
 border-radius:var(--radius-sm);
 border:1px solid #ffffff19;
 background:#0007;
 color:#fff;
 outline:none;
 box-sizing:border-box;
}

.input:focus,.area:focus,.select:focus{
 border-color:#00e5ff;
 box-shadow:0 0 15px #00e5ff22;
}

.area{
 min-height:120px;
 resize:vertical;
}

.search{
 max-width:300px;
}

.chips{
 display:flex;
 gap:var(--sp-2);
 flex-wrap:wrap;
 margin:var(--sp-3) 0;
 position:relative;
 z-index:5;
}

.chip{
 border:1px solid #ffffff18;
 background:#ffffff09;
 color:#fff;
 padding:8px 11px;
 border-radius:99px;
 cursor:pointer;
 pointer-events:auto;
 touch-action:manipulation;
 -webkit-tap-highlight-color:transparent;
}

.chip.active{
 background:#5b5cff55;
 border-color:#5b5cff;
}

.grid{
 display:grid;
 grid-template-columns:repeat(5,minmax(0,1fr));
 gap:var(--sp-3);
 align-items:stretch;
 grid-auto-rows:auto;
}

/* Layout-only fix: make each product row stretch evenly. */
.grid > .card{
 align-self:stretch;
 min-height:100%;
}

.grid > .card .body{
 height:100%;
 box-sizing:border-box;
}

.card{
 overflow:hidden;
 transition:.2s;
 height:100%;
 min-width:0;
 display:flex;
 flex-direction:column;
}

.card:hover{
 transform:translateY(-4px);
 border-color:#00e5ff44;
 box-shadow:0 15px 50px #0008;
}

.pic-wrap{
 position:relative;
 width:100%;
 aspect-ratio:1 / 1;
 overflow:hidden;
 background:linear-gradient(160deg,#141a35,#0a0e22);
 flex:0 0 auto;
}

.pic{
 width:100%;
 aspect-ratio:1/1;
 height:100%;
 object-fit:cover;
 display:block;
}

.pic-wrap:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(180deg,#00000000 55%,#050716dd 100%);
 pointer-events:none;
}

.pic-badge{
 position:absolute;
 left:9px;
 bottom:9px;
 z-index:2;
 font-size:10.5px;
 font-weight:800;
 letter-spacing:.3px;
 padding:4px 9px;
 border-radius:99px;
 backdrop-filter:blur(4px);
 display:inline-flex;
 align-items:center;
 gap:5px;
}

.pic-badge:before{
 content:"";
 width:6px;
 height:6px;
 border-radius:50%;
 background:currentColor;
}

.body{
 padding:var(--sp-3);
 display:flex;
 flex-direction:column;
 flex:1;
 min-width:0;
 min-height:170px;
}

.body h3{
 min-height:2.3em;
 line-height:1.22;
 margin:2px 0 5px;
 overflow-wrap:anywhere;
 font-size:13.5px;
}

.body > .muted{
 min-height:2.4em;
 line-height:1.4;
 overflow-wrap:anywhere;
 font-size:11.5px;
}

.badge{
 font-size:11px;
 color:#93c5fd;
 background:#2563eb1b;
 padding:4px 7px;
 border-radius:7px;
}

.price{
 font-size:16px;
 font-weight:900;
 margin:4px 0;
 padding-top:var(--sp-2);
 border-top:1px solid #ffffff12;
}

.old{
 text-decoration:line-through;
 color:#737b9c;
 font-size:12px;
 margin-left:5px;
}

.stock{
 font-size:12px;
 color:#75ffc0;
}

.actions{
 display:flex;
 gap:7px;
 margin-top:auto;
 padding-top:12px;
}

.actions .btn{
 flex:1;
 min-height:38px;
 padding:8px 6px;
 font-size:12.5px;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
}

.pillrow{
 display:flex;
 gap:var(--sp-3);
 overflow:auto;
}

.pill{
 min-width:130px;
 padding:15px;
 border-radius:14px;
 background:#ffffff08;
 border:1px solid #ffffff15;
 font-weight:900;
}

.modal{
 position:fixed;
 inset:0;
 background:#000c;
 backdrop-filter:blur(9px);
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:16px;
}

.modalbox{
 width:min(700px,100%);
 max-height:92vh;
 overflow:auto;
 background:#090d20;
 border:1px solid #ffffff1b;
 border-radius:20px;
 padding:20px;
}

.modalhead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.formgrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:var(--sp-3);
}

.full{
 grid-column:1/-1;
}

.label{
 display:block;
 font-size:12px;
 color:#b9c2df;
 margin:10px 0 5px;
}

.order{
 padding:13px;
 border:1px solid #ffffff15;
 border-radius:13px;
 margin:8px 0;
 background:#ffffff06;
}

.adminGrid{
 display:grid;
 grid-template-columns:220px 1fr;
 gap:var(--sp-4);
}

.side{
 padding:10px;
 height:max-content;
 position:sticky;
 top:83px;
}

.side button{
 width:100%;
 text-align:left;
 border:0;
 background:transparent;
 color:#bac2df;
 padding:11px;
 border-radius:10px;
}

.side button.active,
.side button:hover{
 background:#ffffff0c;
 color:#fff;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:var(--sp-3);
}

.stat{
 padding:17px;
 border:1px solid #ffffff16;
 border-radius:15px;
 background:#0c1227d9;
}

.stat b{
 display:block;
 font-size:27px;
 margin-top:6px;
}

.tablewrap{
 overflow:auto;
 border:1px solid #ffffff16;
 border-radius:15px;
}

.table{
 width:100%;
 border-collapse:collapse;
}

.table th,.table td{
 padding:11px;
 border-bottom:1px solid #ffffff14;
 text-align:left;
 font-size:13px;
}

.toast{
 position:fixed;
 right:15px;
 bottom:15px;
 z-index:200;
 background:#10162d;
 border:1px solid #ffffff1b;
 padding:13px 16px;
 border-radius:12px;
}

.ai-box{
 background:
 linear-gradient(135deg,#5b5cff18,#2563eb18,#00e5ff10);
 border:1px solid #ffffff18;
 border-radius:20px;
 padding:20px;
}

.ai-message{
 padding:12px;
 border-radius:13px;
 background:#ffffff08;
 margin:8px 0;
 white-space:pre-wrap;
}

.ai-user{
 border-left:3px solid #00e5ff;
}

.ai-bot{
 border-left:3px solid #2563eb;
}

.ai-lock{
 text-align:center;
 padding:25px;
}

.warning{
 color:#ffd166;
 font-size:13px;
}

.price-list{
 display:grid;
 gap:var(--sp-2);
 margin-top:var(--sp-4);
}

.price-item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 padding:12px;
 border:1px solid #ffffff14;
 background:#ffffff06;
 border-radius:13px;
}

.price-item b{
 color:#fff;
}

.price-item span{
 color:#75ffc0;
 font-weight:900;
}

.product-detail-img{
 width:100%;
 aspect-ratio:1/1;
 max-height:340px;
 object-fit:cover;
 border-radius:var(--radius-md);
 margin-bottom:var(--sp-4);
}

.detail-actions{
 display:flex;
 gap:8px;
 margin-top:15px;
}

.detail-actions>*{
 flex:1;
}

.option-select{
 margin-top:10px;
}

.category-banner{
 padding:18px;
 border:1px solid #ffffff14;
 border-radius:18px;
 margin-bottom:15px;
 background:
 linear-gradient(135deg,#5b5cff16,#2563eb16);
}

.hidden{
 display:none!important;
}

.bottom{
 display:none;
}

.quick-menu{margin-top:22px}
.quick-menu-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.quick-menu-card{border:1px solid #ffffff16;background:linear-gradient(135deg,#2563eb1a,#5b5cff18,#00e5ff12);color:#fff;border-radius:16px;padding:16px;text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 10px 30px #0005}
.quick-menu-card:hover{transform:translateY(-2px);border-color:#00e5ff55}
.quick-menu-card b{display:block;font-size:15px}
.quick-menu-card small{display:block;color:#b8bfd7;margin-top:3px;font-size:12px}
.quick-icon{font-size:28px;flex:0 0 auto}
@media(max-width:900px){.quick-menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media(max-width:520px){
 .wrap{
  width:min(100% - 20px,1180px);
 }
 .card h3{
  font-size:14px;
  line-height:1.25;
 }
 .muted{
  line-height:1.4;
 }
.quick-menu-card{padding:12px}.quick-menu-card small{font-size:10px}.quick-icon{font-size:24px}}

.footer{
 padding:40px 0 70px;
 color:#9099b8;
 border-top:1px solid #ffffff15;
}

@media(max-width:900px){

 .hero-grid,.adminGrid{
  grid-template-columns:1fr;
 }

 .grid{
  grid-template-columns:repeat(3,minmax(0,1fr));
 }

 .nav{
  align-items:flex-start;
  padding:8px 0;
 }

 .navlinks{
  display:flex;
  overflow-x:auto;
  max-width:100%;
  padding-bottom:4px;
  scrollbar-width:none;
 }

 .navlinks::-webkit-scrollbar{
  display:none;
 }

 .navlinks button{
  flex:0 0 auto;
  white-space:nowrap;
  padding:8px 10px;
  font-size:12px;
 }

 .bottom{
  position:fixed;
  display:flex;
  bottom:0;
  left:0;
  right:0;
  background:#050716ee;
  z-index:50;
  padding:7px;
  border-top:1px solid #ffffff16;
 }

 .bottom button{
  flex:1;
  background:none;
  border:0;
  color:#bbc4df;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  padding:5px 2px;
 }

 .bottom button.bottom-active{
  color:#00e5ff;
 }

 .bottom svg{
  width:22px;
  height:22px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
 }

 .bottom .wish-dot{
  position:absolute;
  top:-2px;
  right:-6px;
  min-width:15px;
  height:15px;
  padding:0 3px;
  border-radius:99px;
  background:#ff4d8d;
  color:#fff;
  font-size:9px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
 }

 .bottom .icon-wrap{
  position:relative;
  display:flex;
 }

 .stats{
  grid-template-columns:repeat(2,1fr);
 }

}

@media(max-width:520px){

 .formgrid{
  grid-template-columns:1fr;
 }

 .full{
  grid-column:auto;
 }

 .hero{
  padding-top:35px;
 }

 .grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:var(--sp-2);
  align-items:stretch;
 }

 .body{
  padding:var(--sp-2);
  min-height:175px;
 }

 .body h3{
  min-height:2.3em;
  font-size:12.5px;
 }

 .body > .muted{
  min-height:2.6em;
  font-size:11px;

 if(colName==="testimonials"){

async function getDocs(ref){
 const table=SB_TABLE[ref.collection];
 if(!table) return {docs:[]};
 let q=sb.from(table).select("*");
 for(const o of (ref.orders||[])){
  const col=(ref.collection==="testimonials"&&o.field==="createdAt")?"created_at":o.field;
  q=q.order(col,{ascending:o.direction!=="desc"});
 }
 const {data,error}=await q;
 if(error){console.warn("getDocs",table,error.message);return {docs:[]};}
 return {docs:(data||[]).map(row=>({id:row.id,data:()=>jkRowToData(ref.collection,row)}))};
}
async function getDoc(ref){
 const table=SB_TABLE[ref.collection];
 if(!table) return {exists:()=>false,data:()=>undefined,id:ref.id};
 const {data,error}=await sb.from(table).select("*").eq("id",ref.id).maybeSingle();
 if(error||!data) return {exists:()=>false,data:()=>undefined,id:ref.id};
 return {exists:()=>true,data:()=>jkRowToData(ref.collection,data),id:ref.id};
}
async function setDoc(ref,data,opts={}){
 const table=SB_TABLE[ref.collection];
 if(!table) return;
 const row={id:ref.id,...jkDataToRow(ref.collection,data)};
 if(table==="products"||table==="settings") row.updated_at=new Date().toISOString();
 const {error}=await sb.from(table).upsert(row,{onConflict:"id"});
 if(error) throw new Error(error.message||"Gagal menyimpan data");
}
async function addDoc(ref,data){
 const table=SB_TABLE[ref.collection];
 if(!table) return {id:null};
 const row=jkDataToRow(ref.collection,data);
 const {data:inserted,error}=await sb.from(table).insert(row).select("id").single();
 if(error) throw new Error(error.message||"Gagal menambah data");
 return {id:inserted.id};
}

 if(!table) return;

}

/* =========================================================
   AI GATEWAY — sepenuhnya server-side
   Situs ini TIDAK menyimpan API key/model/endpoint AI apa pun
   di browser. Semua pengaturan (termasuk API key) hanya ada di
   tabel `ai_settings` di database, yang dikunci total dari
   klien (RLS aktif tanpa policy). Satu-satunya yang boleh
   membaca/menulis tabel itu adalah Edge Function `ai-gateway`
   (memakai service_role key di server Supabase).
   Browser hanya pernah mengirim {action, ...} ke Edge Function
   dan menerima balasan (jawaban AI, atau status pengaturan
   tanpa key asli) — tidak pernah rahasia apa pun.
   ========================================================= */
const AI_GATEWAY_URL=SUPABASE_URL+"/functions/v1/ai-gateway";

async function aiGatewayCall(action,payload={}){
 const {data:{session}}=await sb.auth.getSession();
 if(!session) throw new Error("Anda harus login terlebih dahulu");
 const res=await fetch(AI_GATEWAY_URL,{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "Authorization":"Bearer "+session.access_token
  },
  body:JSON.stringify({action,...payload})
 });
 const data=await res.json().catch(()=>({}));
 if(!res.ok) throw new Error(data?.error||"Permintaan ke server AI gagal");
 return data;
}

function jkSliderApplyTransform(){
 const track=getEl("jkSliderTrack");
 if(track) track.style.transform=`translateX(-${jkSliderIndex*100}%)`;
 document.querySelectorAll(".jk-slider-dot").forEach((d,i)=>d.classList.toggle("active",i===jkSliderIndex));
}

window.jkSliderGo=dir=>{
 const n=jkSlidesForRender().length;
 if(!n) return;
 jkSliderIndex=(jkSliderIndex+dir+n)%n;
 jkSliderApplyTransform();
 jkSliderRestartAutoplay();
};

window.jkSliderGoTo=i=>{
 jkSliderIndex=i;
 jkSliderApplyTransform();
 jkSliderRestartAutoplay();
};

function jkSliderRestartAutoplay(){
 clearInterval(jkSliderTimer);
 const n=jkSlidesForRender().length;
 if(n>1) jkSliderTimer=setInterval(()=>jkSliderGo(1),4500);
}

function jkSliderInitTouch(){
 const track=getEl("jkSliderTrack");
 const wrap=getEl("jkSlider");
 if(!track||!wrap||track.dataset.jkBound) return;
 track.dataset.jkBound="1";
 let startX=0,deltaX=0,dragging=false;
 const width=()=>wrap.getBoundingClientRect().width;
 track.addEventListener("touchstart",e=>{
  dragging=true;startX=e.touches[0].clientX;deltaX=0;
  track.classList.add("jk-dragging");
  clearInterval(jkSliderTimer);
 },{passive:true});
 track.addEventListener("touchmove",e=>{
  if(!dragging) return;
  deltaX=e.touches[0].clientX-startX;
  track.style.transform=`translateX(calc(-${jkSliderIndex*100}% + ${deltaX}px))`;
 },{passive:true});
 track.addEventListener("touchend",()=>{
  if(!dragging) return;
  dragging=false;
  track.classList.remove("jk-dragging");
  const threshold=width()*0.15;
  if(deltaX>threshold) jkSliderGo(-1);
  else if(deltaX<-threshold) jkSliderGo(1);
  else jkSliderApplyTransform();
  jkSliderRestartAutoplay();
 },{passive:true});
 wrap.addEventListener("mouseenter",()=>clearInterval(jkSliderTimer));
 wrap.addEventListener("mouseleave",jkSliderRestartAutoplay);
 jkSliderRestartAutoplay();
}


/* =========================================================
   DAILY STOCK
   Tampilan stok berubah otomatis setiap hari.
   Ini BUKAN stok database nyata.
   ========================================================= */

function dailyNumber(id,min=800,max=10000){

 const now=new Date();

 const day=
  now.getFullYear()+"-"+
  (now.getMonth()+1)+"-"+
  now.getDate();

 const str=String(id)+day;

 let hash=0;

 for(let i=0;i<str.length;i++){
  hash=
   ((hash<<5)-hash)+
   str.charCodeAt(i);

  hash|=0;
 }

 hash=Math.abs(hash);

 return min+
  (hash%(max-min+1));
}


function displayStock(p){
 let min=Number(p?.stockMin), max=Number(p?.stockMax);
 if(!Number.isFinite(min)) min=800;
 if(!Number.isFinite(max)) max=10000;
 min=Math.max(800,Math.floor(min));
 max=Math.max(min,Math.floor(max));
 return dailyNumber(p?.id||"product",min,max);
}

 );
};


function toast(message){

 const t=
  document.querySelector("#toast");

 t.textContent=message;

 t.classList.remove("hidden");

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>{
  t.classList.add("hidden");
 },3000);
}

async function loadTestimonials(){
 try{
  const snap=await getDocs(query(collection(db,"testimonials"),orderBy("createdAt","desc")));
  const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
  testimonials=rows.length?rows:fallbackTestimoni.map((x,i)=>({id:"seed-"+i,n:x.n,c:x.c,t:x.t}));
 }catch(e){
  testimonials=fallbackTestimoni.map((x,i)=>({id:"seed-"+i,n:x.n,c:x.c,t:x.t}));
 }
}

async function loadSiteMedia(){
 try{
  const s=await getDoc(doc(db,"settings","store"));
  const x=s.exists()?s.data():{};
  banners=Array.isArray(x.banners)?x.banners:[];
  siteVideos=Array.isArray(x.videos)?x.videos:[];
 }catch(e){

 }
}

async function load(){
  try{
    const snap=await getDocs(collection(db,"products"));
    const localProducts=snap.docs.map(d=>({id:d.id,...d.data()}));
    const normalizeMenuCategory=p=>{const name=String(p?.name||"").toUpperCase();if(name.includes("AKUN WARLIT"))return "AKUN WARLIT NEW/OFF";if(name.includes("RW MLBB"))return "RW/DK X JKAdiStore";if(name.includes("RANK VS BOT"))return "RENK VS BOT NEW";return p?.category};
    const uniqueProducts=new Map();[...fallback,...localProducts].forEach(raw=>{const p={...raw,category:normalizeMenuCategory(raw)},key=String(p?.name||p?.id||"").toLowerCase().replace(/[^a-z0-9]+/g,"").trim();if(key)uniqueProducts.set(key,p)});products=[...uniqueProducts.values()];
  }catch(e){products=fallback}
  await Promise.all([loadTestimonials(),loadSiteMedia(),loadAiConfig()]);
  render();setTimeout(jumpToInitialMenu,50)
}

window.startStoreClock=()=>{
 const el=document.getElementById("storeClock");
 if(!el) return;
 if(window.__jkClockTimer) clearInterval(window.__jkClockTimer);
 const update=()=>{
  el.textContent=new Intl.DateTimeFormat("id-ID",{timeZone:"Asia/Jakarta",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date());
 };
 update();
 window.__jkClockTimer=setInterval(update,1000);
};

window.startPromoCountdown=()=>{
 const el=document.getElementById("promoCountdown");
 if(!el) return;
 if(window.__jkPromoTimer) clearInterval(window.__jkPromoTimer);
 const update=()=>{
  const now=new Date();
  const end=new Date(now);
  end.setHours(23,59,59,999);
  let diff=Math.max(0,end-now);
  const h=String(Math.floor(diff/3600000)).padStart(2,"0");
  const m=String(Math.floor((diff%3600000)/60000)).padStart(2,"0");
  const s=String(Math.floor((diff%60000)/1000)).padStart(2,"0");
  el.textContent=`${h}:${m}:${s}`;
 };
 update();
 window.__jkPromoTimer=setInterval(update,1000);
};

/* Pembayaran memakai Saldo/Koin. Saldo hanya bisa BERTAMBAH
   lewat Panel Admin (adminAdjustBalance); di sini saldo hanya
   dikurangi sebesar total belanja saat pengguna membayar. */
window.checkoutWithBalance=async()=>{
 if(!user) return toast("Silakan login terlebih dahulu");
 if(!cart.length){closeM();return toast("Keranjang masih kosong");}

 const items=cart.map(x=>({...x}));
 const grandTotal=total();

 try{

  /* Dipanggil lewat fungsi RPC spend_balance() di server Supabase —
     bukan baca-lalu-tulis dari browser — supaya atomik & tidak bisa
     "double spend" walau checkout diklik dua kali/dua tab sekaligus.
     Lihat supabase/schema.sql bagian 7. */
  const {data,error}=await sb.rpc("spend_balance",{
   p_items:items,

  });

  cart=[];
  save();
  userBalance=Number(data?.balance??0);
  if(user) user.balance=userBalance;
  closeM();
  render();
  toast("Pembayaran berhasil memakai saldo. Sisa saldo: "+rp(userBalance));

 }catch(e){

/* =========================================================
   AI ASSISTANT — Bawa API Sendiri
   Tidak ada API key/model AI yang ditanam di kode situs ini.
   Semua permintaan hanya dikirim jika admin sudah mengisi
   endpoint & kunci API miliknya sendiri di Panel Admin »
   Pengaturan » AI Assistant (lihat aiConfig / loadAiConfig).

   CATATAN KEAMANAN JUJUR:
   Situs ini berjalan 100% di browser (tanpa server backend
   milik sendiri). Jika kolom "Aktifkan untuk semua pengguna"
   dinyalakan, maka setiap pengguna yang memakai fitur AI akan
   mengirim permintaan langsung dari browser mereka ke endpoint
   AI memakai kunci API yang admin masukkan — sehingga kunci
   itu bisa terlihat oleh pengguna tersebut lewat DevTools/tab
   Network saat fitur dipakai. Ini bukan kelemahan kode, tapi
   batas bawaan dari arsitektur "situs statis tanpa server".
   Agar kunci API benar-benar tidak pernah sampai ke browser
   pengguna, kunci tersebut harus disimpan di server/proxy
   terpisah (mis. Supabase Edge Function) yang meneruskan
   permintaan AI — bukan di file HTML ini. Selama itu belum
   dibuat, disarankan biarkan "Aktifkan untuk semua pengguna"
   tetap nonaktif dan gunakan tombol "Tes AI" di Panel Admin
   untuk mencoba sendiri.
   ========================================================= */

async function aiCallProvider(message){
 // Pesan dikirim ke Edge Function ai-gateway; server yang menyimpan &
 // memakai API key dari tabel ai_settings, browser hanya menerima jawaban.
 const data=await aiGatewayCall("chat",{message:String(message||"").slice(0,4000)});
 return data?.answer||"";
}

async function ownerSha256(text){
 const data=new TextEncoder().encode(text);
 const hash=await crypto.subtle.digest("SHA-256",data);
 return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

window.saveProduct=async id=>{

 const priceList=
  getEl("xprices").value
   .split("\n")
   .map(x=>x.trim())
   .filter(Boolean)
   .map(line=>{

    const parts=
     line.split("|");

    return {
     name:parts[0]?.trim()||
      "Paket",
     price:+(
      parts[1]||0
     )
    };

   });


 const stockMin=Math.max(800,Number(getEl("xmin").value)||800);
 const stockMax=Math.max(stockMin,Number(getEl("xmax").value)||10000);
 if(!getEl("xn").value.trim()) return toast("Nama produk wajib diisi");
 const d={
  name:getEl("xn").value.trim(),
  category:getEl("xc").value.trim()||"Lainnya",
  price:Math.max(0,Number(getEl("xp").value)||0),
  oldPrice:Math.max(0,Number(getEl("xo").value)||0),
  stockMin,
  stockMax,

  badge:getEl("xb").value,

  image:
   getEl("xi").value||LOGO,

  description:
   getEl("xd").value,

  priceList:

   priceList.length
   ?
   priceList
   :
   [
    {
     name:"Harga normal",
     price:+getEl("xp").value||0
    }
   ],

  active:true,

  updatedAt:
   serverTimestamp()
 };


 try{

  if(id){

   await setDoc(
    doc(
     db,
     "products",
     id
    ),
    d,
    {
     merge:true
    }
   );

  }else{

   await addDoc(
    collection(
     db,
     "products"
    ),
    {
     ...d,
     createdAt:
      serverTimestamp()
    }
   );

  }


  toast(
   "Produk disimpan"
  );

  closeM();

  load();


 }catch(e){

  console.error(e);

  toast(
   "Gagal menyimpan produk"
  );

 }

};

window.jkPickImage=(fileInputId,targetInputId)=>{
 const f=getEl(fileInputId)?.files?.[0];
 if(!f) return;
 if(!f.type.startsWith("image/")){ toast("File harus berupa gambar"); return; }
 if(f.size>800*1024){ toast("Ukuran gambar maksimal 800KB agar situs tetap ringan & cepat"); return; }
 const reader=new FileReader();
 reader.onload=()=>{
  const el=getEl(targetInputId);
  if(el) el.value=reader.result;
  toast("Gambar siap — klik Simpan");
 };
 reader.readAsDataURL(f);
};

async function ensureTestimoniSeeded(){
 let snap=await getDocs(collection(db,"testimonials"));
 if(snap.docs.length===0){
  for(const x of fallbackTestimoni){
   await addDoc(collection(db,"testimonials"),{n:x.n,c:x.c,t:x.t,photo:"",createdAt:serverTimestamp()});
  }
  snap=await getDocs(collection(db,"testimonials"));
 }
 return snap.docs.map(d=>({id:d.id,...d.data()}));
}

window.saveTestimoni=async id=>{

 if(!getEl("tn").value.trim()) return toast("Nama wajib diisi");
 if(!getEl("tt").value.trim()) return toast("Isi testimoni wajib diisi");

 const d={
  n:getEl("tn").value.trim(),
  c:getEl("tc").value.trim(),
  t:getEl("tt").value.trim(),
  photo:getEl("tp").value.trim(),
  updatedAt:serverTimestamp()
 };

 try{
  const seeded=await ensureTestimoniSeeded();
  let realId=id;
  if(id&&String(id).startsWith("seed-")){
   realId=seeded[Number(id.split("-")[1])]?.id;
  }
  if(realId){
   await setDoc(doc(db,"testimonials",realId),d,{merge:true});
  }else{
   await addDoc(collection(db,"testimonials"),{...d,createdAt:serverTimestamp()});
  }
  toast("Testimoni disimpan");
  closeM();
  await loadTestimonials();
  render();
  adminPage();
 }catch(e){
  console.error(e);
  toast("Gagal menyimpan testimoni");
 }
};

window.delTestimoni=async id=>{
 if(!confirm("Hapus testimoni ini?")) return;
 try{
  const seeded=await ensureTestimoniSeeded();
  let realId=id;
  if(String(id).startsWith("seed-")){
   realId=seeded[Number(id.split("-")[1])]?.id;
  }
  if(realId) await deleteDoc(doc(db,"testimonials",realId));
  toast("Testimoni dihapus");
  await loadTestimonials();
  render();
  adminPage();
 }catch(e){
  toast("Gagal menghapus testimoni");
 }
};

/* Hanya admin yang dapat mengubah saldo/role pengguna lain —
   ditegakkan DUA KALI: sekali di UI (tombol ini disembunyikan di
   balik halaman admin) dan sekali lagi (yang sesungguhnya, tak
   bisa dilewati) oleh Row Level Security + fungsi adjust_balance()
   di server Supabase. Lihat supabase/schema.sql. */
window.adminAdjustBalance=async(uid,sign)=>{
 if(!(admin||ownerUnlocked)) return toast("Hanya admin yang dapat mengatur saldo");
 const raw=Number(getEl("bal_"+uid)?.value||0);
 if(!raw||raw<0) return toast("Masukkan jumlah saldo yang valid");
 try{
  const {data,error}=await sb.rpc("adjust_balance",{
   p_target_id:uid,
   p_delta:sign*raw,
   p_reason:"Penyesuaian admin lewat Panel Admin"
  });
  if(error) throw new Error(error.message||"Gagal mengubah saldo");
  toast("Saldo diperbarui: "+rp(Number(data)));
  if(user&&user.uid===uid){userBalance=Number(data);user.balance=userBalance;render();}
  loadUsers();
 }catch(e){
  toast(e?.message||"Gagal mengubah saldo");
 }
};

window.adminSetRole=async(uid,role)=>{
 if(!(admin||ownerUnlocked)) return toast("Hanya admin yang dapat mengubah role");
 try{
  const {error}=await sb.from("profiles").update({role}).eq("id",uid);
  if(error) throw new Error(error.message||"Gagal mengubah role");
  toast("Role diperbarui menjadi "+role);
  loadUsers();
 }catch(e){
  toast(e?.message||"Gagal mengubah role");
 }
};

function applyStoreBackground(url){

  document.body.style.backgroundSize="cover";
  document.body.style.backgroundAttachment="fixed";
 }else{
  document.body.style.backgroundImage="";

  document.body.style.backgroundAttachment="";
 }
}

window.jkCalcRun=()=>{
 const unit=Number(getEl("calcUnit")?.value||0);
 const qty=Number(getEl("calcQty")?.value||1);
 const disc=Number(getEl("calcDisc")?.value||0);
 const fee=Number(getEl("calcFee")?.value||0);
 const subtotal=unit*qty;
 const discAmt=subtotal*(Math.min(Math.max(disc,0),100)/100);
 const total=Math.max(0,subtotal-discAmt+fee);
 if(getEl("calcSubtotal")) getEl("calcSubtotal").textContent=rp(subtotal);
 if(getEl("calcDiscAmt")) getEl("calcDiscAmt").textContent="- "+rp(discAmt);
 if(getEl("calcTotal")) getEl("calcTotal").textContent=rp(total);
};
